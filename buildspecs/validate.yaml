version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet cfn-lint checkov
  build:
    commands:
      - echo "== cfn-lint =="
      - cfn-lint guardrails/*/template.yaml pipeline/pipeline.yaml
      - echo "== checkov (IaC security scan) =="
      - checkov -d guardrails --framework cloudformation --compact
      - checkov -d pipeline --framework cloudformation --compact
      - echo "== validate-template (por guardrail) =="
      - for f in guardrails/*/template.yaml; do aws cloudformation validate-template --template-body "file://$f"; done
      - echo "== validar JSON de targets (por guardrail) =="
      - for f in guardrails/*/targets.json; do python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done

artifacts:
  files:
    - '**/*'

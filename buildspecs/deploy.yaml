version: 0.2

# Recibe DEPLOY_STAGE (auto|approved) desde la accion del pipeline

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet boto3
  build:
    commands:
      - echo "Desplegando guardrails, etapa ${DEPLOY_STAGE}"
      - python scripts/deploy_stackset.py --stage "${DEPLOY_STAGE}"

version: 0.2

# Recibe TARGET_ENV (dev|qa|prod) desde la accion del pipeline

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet boto3
  build:
    commands:
      - echo "Desplegando StackSet para entorno ${TARGET_ENV}"
      - python scripts/deploy_stackset.py --env "${TARGET_ENV}" --config guardrails/config/deployment-targets.json --template guardrails/template.yaml

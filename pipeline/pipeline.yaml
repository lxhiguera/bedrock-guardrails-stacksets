AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura del pipeline en la cuenta SecDevOps:
  CodePipeline (source GitHub via CodeConnections) -> Validate (CodeBuild)
  -> Approval (prod) -> Deploy StackSet (CodeBuild).
  Desplegar UNA VEZ manualmente (bootstrap) en la cuenta SecDevOps.

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: ARN de la conexion CodeConnections hacia GitHub (crearla y aprobarla antes en la consola)
  GitHubRepo:
    Type: String
    Default: mi-org/bedrock-guardrails-stacksets
    Description: owner/repo en GitHub
  GitHubBranch:
    Type: String
    Default: main
  PipelineName:
    Type: String
    Default: bedrock-guardrails-deploy

Resources:

  # ------------------------------------------------------------------
  # KMS CMK compartida: cifra el bucket de artefactos y el topico SNS.
  # ------------------------------------------------------------------
  PipelineKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'CMK para artefactos S3 y notificaciones SNS de ${PipelineName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: AllowPipelineRolesUsage
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${PipelineName}-pipeline-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${PipelineName}-validate-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${PipelineName}-deploy-role'
            Action: [kms:Decrypt, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
          - Sid: AllowS3ServiceUsage
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
          - Sid: AllowSnsServiceUsage
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }

  PipelineKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${PipelineName}-cmk'
      TargetKeyId: !Ref PipelineKmsKey

  # ------------------------------------------------------------------
  # Almacenamiento de artefactos (cifrado, sin acceso publico)
  # ------------------------------------------------------------------
  # Bucket dedicado a los access logs del bucket de artefactos.
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >-
              Bucket destino de access logs; habilitarle logging a si mismo
              crearia un loop recursivo. Patron estandar de AWS.
    Properties:
      BucketName: !Sub '${PipelineName}-access-logs-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Statement:
          - Sid: AllowArtifactBucketLogDelivery
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/artifact-bucket-access-logs/*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !GetAtt ArtifactBucket.Arn }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${PipelineName}-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PipelineKmsKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: artifact-bucket-access-logs/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 90

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ------------------------------------------------------------------
  # Roles IAM (minimo privilegio)
  # ------------------------------------------------------------------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineName}-pipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: ArtifactsKms
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey*]
                Resource: !GetAtt PipelineKmsKey.Arn
              - Sid: GitHubConnection
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Sid: CodeBuild
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource:
                  - !GetAtt ValidateProject.Arn
                  - !GetAtt DeployProject.Arn
              - Sid: Notifications
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref ApprovalTopic
              - Sid: NotificationsKms
                Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt PipelineKmsKey.Arn

  ValidateBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineName}-validate-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ValidatePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${PipelineName}-*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey*]
                Resource: !GetAtt PipelineKmsKey.Arn
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'

  DeployBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${PipelineName}-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StackSetPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${PipelineName}-*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt PipelineKmsKey.Arn
              - Sid: StackSetsCreate
                Effect: Allow
                Action: cloudformation:CreateStackSet
                Resource: '*'
              - Sid: StackSetsDelegatedAdmin
                Effect: Allow
                Action:
                  - cloudformation:UpdateStackSet
                  - cloudformation:DescribeStackSet
                  - cloudformation:DescribeStackSetOperation
                  - cloudformation:ListStackSetOperations
                  - cloudformation:ListStackInstances
                  - cloudformation:CreateStackInstances
                  - cloudformation:UpdateStackInstances
                  - cloudformation:DeleteStackInstances
                  - cloudformation:StopStackSetOperation
                  - cloudformation:TagResource
                Resource:
                  # El account ID del ARN de un StackSet SERVICE_MANAGED es
                  # el de la cuenta management de Organizations (quien
                  # formalmente "administra" el StackSet), no el de esta
                  # cuenta SecDevOps que opera como delegated admin -- por
                  # eso se usa wildcard en ese segmento en vez de
                  # ${AWS::AccountId}.
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:*:stackset/bedrock-guardrail-*:*'
              - Sid: OrgReadForServiceManaged
                Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:ListAccountsForParent
                  - organizations:DescribeOrganization
                  - organizations:ListDelegatedAdministrators
                Resource: '*'

  # ------------------------------------------------------------------
  # Proyectos CodeBuild
  # ------------------------------------------------------------------
  ValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineName}-validate'
      ServiceRole: !GetAtt ValidateBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/validate.yaml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      TimeoutInMinutes: 15

  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipelineName}-deploy'
      ServiceRole: !GetAtt DeployBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/deploy.yaml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      TimeoutInMinutes: 60

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${PipelineName}-approvals'
      KmsMasterKeyId: !Ref PipelineKmsKey

  # ------------------------------------------------------------------
  # Pipeline
  # ------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      RoleArn: !GetAtt PipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
              OutputArtifacts: [{ Name: SourceOutput }]

        - Name: Validate
          Actions:
            - Name: LintAndScan
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ValidateProject
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: ValidatedOutput }]

        - Name: Deploy
          Actions:
            - Name: StackSetAuto
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployProject
                EnvironmentVariables: '[{"name":"DEPLOY_STAGE","value":"auto"}]'
              InputArtifacts: [{ Name: ValidatedOutput }]

        - Name: ApproveDeploy
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                NotificationArn: !Ref ApprovalTopic
                CustomData: 'Revisar guardrails con require_approval=true antes de aplicarlos'

        - Name: DeployApproved
          Actions:
            - Name: StackSetApproved
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployProject
                EnvironmentVariables: '[{"name":"DEPLOY_STAGE","value":"approved"}]'
              InputArtifacts: [{ Name: ValidatedOutput }]

Outputs:
  PipelineUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${PipelineName}/view'
